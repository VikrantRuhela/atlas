name: Build Atlas Kernel for Galaxy A21s

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev \
            lz4 liblz4-tool make python3 zip

      - name: Setup KernelSU
        run: |
          if [ ! -f "drivers/kernelsu/Kconfig" ]; then
            echo "==> Pulling compatible KernelSU for Linux 4.19..."
            rm -rf drivers/kernelsu
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          fi

      - name: Download Google Clang Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz
          tar -xf clang-r416183b.tar.gz
          cd ..

      - name: Download AnyKernel3 Flashable Template
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 anykernel
          sed -i 's/device.name1=.*/device.name1=a21s/' anykernel/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=a21snsxx/' anykernel/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=SM-A217F/' anykernel/anykernel.sh
          sed -i 's/block=.*/block=\/dev\/block\/by-name\/boot/' anykernel/anykernel.sh
          sed -i 's/is_slot_device=1/is_slot_device=0/' anykernel/anykernel.sh

      - name: Compile Atlas Kernel
        run: |
          export PATH="$(pwd)/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          DEFCONFIG="exynos850-a21snsxx_defconfig"

          echo "==> Configuring defconfig: $DEFCONFIG"
          make O=out $DEFCONFIG

          # Disable -Werror so harmless compiler warnings don't fail the build
          scripts/config --file out/.config --disable CONFIG_WERROR
          scripts/config --file out/.config --set-val CONFIG_SCSC_WLAN_SILENT_RECOVERY y

          echo "==> Starting build..."
          make -j$(nproc --all) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            KCFLAGS="-w" \
            KCPPFLAGS="-w"

      - name: Package Flashable Zip
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image anykernel/Image
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/Image.gz
          fi

          find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} anykernel/dtb.img \; 2>/dev/null || true

          cd anykernel
          ZIP_NAME="Atlas-A21s-WiFiFix-$(date +'%Y%m%d-%H%M').zip"
          zip -r9 "../$ZIP_NAME" * -x .git README.md *placeholder
          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
